log:
  level: info
  job_level: info

runner:
  capacity: 1
  envs:
    DOCKER_BUILDKIT: "1"
    DOCKER_HOST: "tcp://127.0.0.1:2375"
  timeout: 3h
  shutdown_timeout: 3h
  insecure: false
  fetch_timeout: 30s
  fetch_interval: 2s
  report_interval: 1s
  labels:
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest

cache:
  enabled: true

container:
  valid_volumes:
    - renovate-cache
  network: "host"
  privileged: false
  docker_host: "tcp://forgejo-runner-docker:2375"
  force_pull: false

host:
  workdir_parent:

server:
  connections:
    forgejo:
      url: __FORGEJO_URL__
      uuid: __FORGEJO_UUID__
      token: __FORGEJO_TOKEN__
